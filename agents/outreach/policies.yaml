# Statis Outreach Agent — v0 policies.
# Apply with: ./agents/outreach/bootstrap.sh
#
# v0 (today) — uses ONLY condition handlers already deployed on the production
#   evaluator: required_fields, operator_approved. No code deploy needed.
#
# v1 (next push) — once api/app/policy/evaluator.py ships the new handlers
#   (min_icp_score, dnc, days_since_last_contact_gte, max_message_len), promote
#   to the richer policies.v1.yaml in this directory.
#
# Ramp: every linkedin_send_message starts ESCALATED. Aniket approves in console.

rules:
  # ── prospect_intake — pre-LLM ICP gate ──
  # Hard requirement: a verified, non-aggregator company domain. No domain,
  # no message — full stop. Tier-specific rules layer on top.

  # T1 — individual signal (HN/GitHub) with company resolution. Currently
  # gated off until research.py learns to resolve employer + domain (next push).
  - rule_id: outreach_intake_t1_individual
    action_type: prospect_intake
    conditions:
      tier: 1
      has_company_domain: true
      not_aggregator_domain: true
      max_signal_age_days: 14
      min_signal_length: 120
      allowed_sources: [hn, github]
      dnc: false
    decision: APPROVED
    priority: 30
    active: true
    description: "T1: HN/GitHub individual signal + resolved verified company domain"

  # T2 — YC recent batches with agent capabilities + verified domain.
  - rule_id: outreach_intake_t2_yc
    action_type: prospect_intake
    conditions:
      tier: 2
      has_company_domain: true
      not_aggregator_domain: true
      company_batch_in: [Winter 2026, Fall 2025, Summer 2025, Winter 2025, Spring 2026]
      dnc: false
    decision: APPROVED
    priority: 30
    active: true
    description: "T2: YC W25/S25/F25/W26/Sp26 agent companies with verified domain"

  # Universal hard blocks
  - rule_id: outreach_intake_dnc_block
    action_type: prospect_intake
    conditions: {dnc: true}
    decision: DENIED
    priority: 40
    active: true
    description: "Hard deny if author/company is on do-not-contact list"

  - rule_id: outreach_intake_no_domain_block
    action_type: prospect_intake
    conditions: {has_company_domain: false}
    decision: DENIED
    priority: 35
    active: true
    description: "Hard deny if no verified company domain — quality > volume"

  - rule_id: outreach_intake_aggregator_block
    action_type: prospect_intake
    conditions: {not_aggregator_domain: false}
    decision: DENIED
    priority: 35
    active: true
    description: "Deny aggregator/social profile URLs masquerading as company"

  - rule_id: outreach_intake_default_deny
    action_type: prospect_intake
    conditions: {}
    decision: DENIED
    priority: 1
    active: true
    description: "Default deny — must match a tier rule with verified domain"

  # ── prospect_scored — every score is a receipt ──
  - rule_id: outreach_prospect_scored_default
    action_type: prospect_scored
    conditions: {}
    decision: APPROVED
    priority: 10
    active: true
    description: "Auto-approve scoring; log all decisions to ledger"

  # ── prospect_qualified — post-score ICP gate ──
  - rule_id: outreach_qualified_high_score
    action_type: prospect_qualified
    conditions:
      min_icp_score: 70
      has_inferred_role: true
      not_disqualified: true
    decision: APPROVED
    priority: 30
    active: true
    description: "Advance to draft when score>=70 + role identified + not disqualified"

  - rule_id: outreach_qualified_borderline
    action_type: prospect_qualified
    conditions: {min_icp_score: 60, not_disqualified: true}
    decision: ESCALATED
    priority: 20
    active: true
    description: "Escalate borderline (60-69) for manual triage; never escalate disqualified"

  - rule_id: outreach_qualified_default_deny
    action_type: prospect_qualified
    conditions: {}
    decision: DENIED
    priority: 1
    active: true
    description: "Deny low scores, missing role, or LLM-disqualified"

  # ── outreach_draft_message — auto-approve drafts with required fields ──
  - rule_id: outreach_draft_complete
    action_type: outreach_draft_message
    conditions:
      required_fields: [message_body, signal_url, channel]
    decision: APPROVED
    priority: 20
    active: true
    description: "Auto-approve drafts that include the message body + signal context"

  - rule_id: outreach_draft_default_deny
    action_type: outreach_draft_message
    conditions: {}
    decision: DENIED
    priority: 1
    active: true
    description: "Deny drafts missing required fields"

  # ── linkedin_send_message — every send escalated for human review (v0) ──
  - rule_id: outreach_send_review
    action_type: linkedin_send_message
    conditions:
      required_fields: [recipient_profile, message_body, recipient_name]
    decision: ESCALATED
    priority: 20
    active: true
    description: "Wk1-2 ramp: every send goes through Aniket's console review"

  - rule_id: outreach_send_default_deny
    action_type: linkedin_send_message
    conditions: {}
    decision: DENIED
    priority: 1
    active: true
    description: "Deny sends missing recipient or message body"

  # ── sheets_append_row — auto-approve when required fields present ──
  - rule_id: outreach_sheets_log
    action_type: sheets_append_row
    conditions:
      required_fields: [prospect_name, linkedin_url, icp_score]
    decision: APPROVED
    priority: 20
    active: true
    description: "Auto-approve sheet logging when all required fields present"

  - rule_id: outreach_sheets_log_default_deny
    action_type: sheets_append_row
    conditions: {}
    decision: DENIED
    priority: 1
    active: true
    description: "Deny sheet writes missing required fields"

  # ── schedule_followup — placeholder for v1; allow all today ──
  - rule_id: outreach_followup_default
    action_type: schedule_followup
    conditions: {}
    decision: APPROVED
    priority: 10
    active: true
    description: "Auto-approve follow-up scheduling — denied later by sends_count rule (v1)"

  # ── outreach_reply_received — pure ledger event ──
  - rule_id: outreach_reply_received_default
    action_type: outreach_reply_received
    conditions: {}
    decision: APPROVED
    priority: 10
    active: true
    description: "Always approve reply detection — pure ledger event"
