services:
  - type: web
    name: statis-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: worker
    name: statis-worker
    runtime: python
    buildCommand: pip install -r api/requirements.txt
    startCommand: PYTHONPATH=api python worker/main.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: POLL_INTERVAL
        value: "1"
