[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statis-ai"
version = "0.4.2"
description = "Python SDK for Statis — the trust layer for production AI agents (policy-gated tool calls + signed receipts)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["httpx>=0.24.0", "pyyaml>=6.0", "statis-kit>=0.1.0"]
keywords = ["ai", "agents", "statis", "policy", "audit", "receipts", "tool-use", "llm", "governance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: Security",
]

[project.optional-dependencies]
# AARM R5 receipt verification — opt-in to keep the base install slim.
# Enable via:  pip install "statis-ai[verify]"
verify = ["cryptography>=42.0"]
dev = ["pytest>=7.0", "respx>=0.20", "pytest-asyncio", "cryptography>=42.0"]

[project.scripts]
statis = "statis.cli:main"

[project.urls]
Homepage = "https://statis.dev"
Repository = "https://github.com/statis-ai/statis-core"
Documentation = "https://statis.dev/docs"
Issues = "https://github.com/statis-ai/statis-core/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/statis"]
